<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddy</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--
      A janela inteira é transparente. Só estes dois elementos são "sólidos":
      o balão e o personagem. O resto da janela deixa o clique passar
      (ver src/janela/clickThrough.ts).
    -->
    <main class="palco">
      <section id="balao" class="balao" role="dialog" aria-live="polite" aria-hidden="true">
        <p id="balao-texto" class="balao-texto"></p>
        <!-- Mostra EXATAMENTE o que o "Sim" vai fazer (ex.: o texto da busca) -->
        <p id="balao-detalhe" class="balao-detalhe" hidden></p>
        <div class="balao-botoes">
          <button id="btn-sim" class="btn btn-sim" type="button">Sim</button>
          <button id="btn-nao" class="btn btn-nao" type="button">Agora não</button>
        </div>
        <!-- Barrinha que mostra quanto tempo falta para o balão sumir sozinho -->
        <div class="balao-tempo"><span id="balao-barra"></span></div>
      </section>

      <div id="buddy" class="buddy" title="Clique para falar comigo · dois cliques para eu dormir · arraste para mover">
        <!-- Sombra e flutuação ficam em <div>s (HTML) e não dentro do SVG: a GPU
             anima divs sem redesenhar nada. Ver comentário no styles.css. -->
        <div class="buddy-sombra"></div>
        <div class="buddy-flutua">
        <!--
          Personagem: desenhos originais buddy-idle / buddy-happy / buddy-sleeping.
          Todos os rostos ficam aqui dentro; o CSS mostra só o do humor atual
          (classes .feliz, .dormindo, .falando... no #buddy). O corpo é o mesmo.

          Mudanças em relação ao desenho original:
          - contorno sutil no corpo: o creme sumia em cima de páginas brancas;
          - os "z" viraram traços (path): <text> depende da fonte instalada;
          - o LED de status (.status) fica na LATERAL do rosto: embaixo, no meio,
            ele parecia uma boca (e no feliz virava "duas bocas").
        -->
        <svg viewBox="6 -6 100 90" width="104" height="94" aria-hidden="true">
          <path
            class="corpo"
            d="M13 55 C13 26 27 13 47 13 C67 13 81 26 81 55 Q81 78 47 78 Q13 78 13 55Z"
            fill="#F2EFE8"
            stroke="rgba(23,23,23,0.22)"
            stroke-width="1.5"
          />

          <!-- Normal: olhos que seguem o mouse (.pupila) e piscam (.piscar) -->
          <g class="rosto rosto-normal">
            <g class="olhos-pos">
              <g class="pupila" fill="#171717">
                <rect class="piscar" x="32" y="37" width="6" height="13" rx="3" />
                <rect class="piscar" x="56" y="37" width="6" height="13" rx="3" />
              </g>
            </g>
          </g>

          <!-- Feliz: olhos em arco + sorriso -->
          <g class="rosto rosto-feliz" fill="none" stroke="#171717" stroke-linecap="round">
            <path d="M29 45 Q35 36 41 45" stroke-width="3" />
            <path d="M53 45 Q59 36 65 45" stroke-width="3" />
            <path d="M42 55 Q47 61 52 55" stroke-width="2" />
          </g>

          <!-- Dormindo: olhos fechados + zz -->
          <g class="rosto rosto-dormindo">
            <g stroke="#171717" stroke-width="3" stroke-linecap="round">
              <path d="M29 45 H41" />
              <path d="M53 45 H65" />
            </g>
            <g class="zz" fill="none" stroke="#FF7849" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M86 10 H95 L86 20 H95" />
              <path d="M97 -1 H103 L97 6 H103" />
            </g>
          </g>

          <!-- Boca extra (só no triste, junto com o rosto normal) -->
          <path class="boca boca-triste" d="M42 61 Q47 56 52 61" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" />

          <!-- LED de status: laranja = ok; pulsando = pensando;
               vermelho = Ollama fora do ar; apagado = dormindo -->
          <circle class="status" cx="69" cy="61" r="2.5" />
        </svg>
        </div>
      </div>
    </main>
  </body>
</html>
